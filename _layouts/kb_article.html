---
layout: common
---
<style>
  /* 
    KB Article Layout Styles
    - Inherits from 'common' but overrides container width for better data density.
    - Uses monospace font to match the 'terminal' aesthetic of the site.
  */
  .kb-article-container {
    width: 96%; /* Small margins (2%) to maximize content area */
    max-width: 1600px; 
    margin: 0 auto;
    padding: 20px;
    font-family: 'Courier New', Courier, monospace;
    color: #222;
  }

  .kb-article-header {
    border-bottom: 2px solid #000;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
  }

  .kb-article-title {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
  }

  .kb-article-meta {
    font-size: 0.9rem;
    color: #555;
  }

  .kb-article-content {
    line-height: 1.5;
  }

  .kb-article-content img {
    max-width: 100%;
    height: auto;
    border: 1px solid #000;
    margin: 1rem 0;
  }
</style>

<div class="kb-article-container">
  <header class="kb-article-header">
    <h1 class="kb-article-title">{{ page.title }}</h1>
    <div class="kb-article-meta">
      CATEGORY: {{ page.category | upcase }} | LAST UPDATED: {{ page.last_updated | date: "%Y-%m-%d" }}
    </div>
  </header>

  <div class="kb-article-content">
    {% include anchor_headings.html html=content anchorBody="#" %}
  </div>
</div>
