---
layout: page
---

<!-- 
  KB ARTICLE LAYOUT (V3 - Open Canvas)
  Removes borders and fixed-width containers to allow full content flow.
  Maintains Light Mode aesthetic via background color.
-->

<style>
  /* CSS SURGERY: Hide Site Title and Footer */
  header .site-title { display: none !important; }
  footer, .site-footer { display: none !important; }

  /* MAIN CANVAS: The entire reading area */
  .kb-canvas {
    background-color: #ffffff; /* Pure white background */
    color: #111;               /* Near-black text for high contrast */
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;         /* Ensure it fills the screen */
    padding: 40px;             /* Generous padding for readability */
    
    /* REMOVED: Border, Box-Shadow, Width Constraints */
  }

  /* TYPOGRAPHY: Clean and bold */
  .kb-canvas h1 { 
    font-size: 2.2rem; 
    border-bottom: 4px solid #000; 
    margin-bottom: 0.5rem; 
    padding-bottom: 10px;
    line-height: 1.2;
    color: #000;
  }

  .kb-canvas h2 { 
    font-size: 1.6rem; 
    margin-top: 3rem; 
    border-bottom: 1px solid #ccc; 
    padding-bottom: 5px;
    color: #000;
  }

  .kb-canvas h3 { 
    font-size: 1.3rem; 
    margin-top: 2rem; 
    color: #222;
  }

  .kb-canvas p, .kb-canvas li { 
    font-size: 1rem; 
    line-height: 1.7; /* Relaxed reading */
    color: #333; 
    max-width: 800px; /* Optional: Keep paragraph text from getting too wide to read */
  }

  /* LINKS */
  .kb-canvas a { color: #0056b3; text-decoration: underline; }
  .kb-canvas a:hover { color: #003d80; }

  /* CODE BLOCKS */
  .kb-canvas code { background-color: #f1f1f1; color: #d63384; padding: 2px 6px; border-radius: 3px; }
  .kb-canvas pre { 
    background-color: #2d2d2d; 
    color: #f8f8f2; 
    padding: 1.5rem; 
    border-radius: 6px; 
    overflow-x: auto; 
    margin: 1.5rem 0;
  }

  /* TABLES: Unconstrained */
  .kb-canvas table { 
    width: 100%; 
    border-collapse: collapse; 
    margin: 2.5rem 0; 
    font-size: 0.95rem;
    /* Removed overflow-x: auto to allow natural expansion */
  }
  
  .kb-canvas th { background-color: #f8f8f8; font-weight: bold; text-align: left; border-bottom: 2px solid #000; padding: 12px; }
  .kb-canvas td { border-bottom: 1px solid #ddd; padding: 12px; vertical-align: top; }

  /* CALLOUTS */
  .kb-callout { padding: 1.5rem; margin: 2rem 0; border-left: 6px solid #333; background: #f9f9f9; max-width: 900px; }
  .kb-callout.warning { border-color: #d32f2f; background: #fff5f5; }
  .kb-callout.note { border-color: #1976d2; background: #e3f2fd; }

  /* METADATA */
  .kb-breadcrumbs { font-size: 0.9rem; margin-bottom: 2rem; color: #666; }
  .kb-breadcrumbs a { color: #666; text-decoration: none; }
  .kb-meta { margin-top: 5rem; padding-top: 2rem; border-top: 1px solid #eee; color: #888; font-size: 0.85rem; }

  /* MOBILE ADJUSTMENTS */
  @media (max-width: 700px) {
    .kb-canvas { padding: 20px; } /* Reduce padding on small screens */
    .kb-canvas h1 { font-size: 1.8rem; }
  }
</style>

<div class="kb-canvas">
  
  <div class="kb-breadcrumbs">
    <a href="/">~</a> / <a href="/kb">KB</a> / {{ page.category | default: "General" }}
  </div>

  <h1>{{ page.title }}</h1>
  
  <div style="margin-bottom: 3rem; color: #666; font-size: 0.9rem;">
    Last Updated: {{ page.last_updated | date: "%Y-%m-%d" }}
  </div>

  <div class="kb-content-body">
    {{ content }}
  </div>

  <footer class="kb-meta">
    TAGS: {{ page.tags | join: ", " }}
  </footer>

</div>
